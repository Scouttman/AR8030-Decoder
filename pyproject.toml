[project]
name = "ar8030-decoder"
version = "0.1.0"
description = "Decoder for the Artosyn AR8030 video downlink: IQ recording to H.265 frames"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.scripts]
ar8030-demod = "ar8030_decoder.demod:main"
ar8030-decode = "ar8030_decoder.stream:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ar8030_decoder"]
